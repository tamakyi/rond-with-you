# rond-with-you 站点配置样例
# 复制为 conf/app.ini 后按实际情况修改：cp conf/app.example.ini conf/app.ini
# 只有 dsn 是必填项，其余留空或删掉都会走默认值。

# 监听地址。放在反向代理后面时通常保持 :8080，由代理转发进来
listen = :8080

# PostgreSQL 连接串（必填）
# 库不存在时会自动创建（要求该账号有 CREATEDB 权限），随后自动建表
# 库名/账号里含特殊字符时记得做 URL 编码
dsn = postgres://postgres:your-password@127.0.0.1:5432/rond_with_you?sslmode=disable

# 会话签名密钥（64 位十六进制），留空则每次启动随机生成，重启后需要重新登录
# 生成方式：openssl rand -hex 32
secret_key =

# 上传文件与解析中间文件目录（启动时自动创建）
upload_dir = storage/uploads
data_dir = storage/data

# 登录有效期（天）
session_days = 14

# ---------- 底图 ----------
# amap     高德地图，免密钥栅格瓦片，开箱可用（默认）
# tianditu 天地图，必须同时填 map_key
# custom   自备瓦片服务，必须填 map_tile_url 与 map_crs
map_provider = amap

# 地图密钥（天地图 tk，或高德/自建服务需要的 key）
# 填了之后瓦片改由服务端转发，密钥不会出现在页面源码里；留空则由浏览器直连上游
# 天地图密钥申请： https://console.tianditu.gov.cn/api/key
map_key =

# 仅 map_provider = custom 时使用。支持 {s} {x} {y} {z} {key} 占位符
map_tile_url =

# 仅 map_provider = custom 时使用，声明该底图的坐标系：gcj02 或 wgs84
# 站点数据本身是 GCJ-02，选 wgs84（天地图 / OSM）时前端会自动纠偏
map_crs =

# 说明：「默认铺哪张底图」（街道 / 纯路网 / 卫星影像 / OSM）在**后台 → 设置 → 地图底图**里选，
# 不在这里配。纯路网不带 POI 与路名标注，点位密集、放到最大时看着更清楚；
# 访客在地图上手动切换过的话，浏览器会记住他自己的选择。

# ---------- 后台「新增地点」按名称搜坐标 ----------
# 高德 Web 服务类型 Key。注意：与瓦片用的 JS Key 不是同一种，需要在
# 高德开放平台单独申请（免费）：https://lbs.amap.com/api/webservice/create-project-and-key
# 只经服务端 /api/geocode 代理调用，不会出现在页面源码里；
# 留空则该功能关闭，仍可手动填经纬度或在地图上点选。
geocode_key =

# ---------- 地点图片的对象存储（可选） ----------
# 「图片存本地还是存对象存储」在后台 → 设置 → 图片存储 里切换；这里只放凭据，
# 不进数据库、也不会下发到前端。全部留空 = 只能用服务器本地磁盘
# （图片落在 data_dir 下的 media/ 目录，由站点自己直出）。
#
# 图片由**浏览器**转成 WebP 后再上传（长边 2000px、质量 0.82），服务端只负责收下与转存，
# 不做解码，1 核机器也扛得住。对象名形如 <数据集>/<上传月份>/<地点号>-<哈希>.webp：
# 按月份分目录便于整月备份与迁移，带地点号便于在控制台上一眼认出来，带内容哈希可天然去重。
#
# 以 Cloudflare R2 为例（S3 兼容，其他 S3 服务同理）：
#   s3_endpoint    https://<账号ID>.r2.cloudflarestorage.com
#   s3_region      auto
#   s3_bucket      桶名
#   s3_access_key  R2 API 令牌的 Access Key ID
#   s3_secret_key  R2 API 令牌的 Secret Access Key
#   s3_public_base 桶的公开域名（自定义域或 r2.dev 域名），拼上对象名就是 <img src>
#
# s3_public_base 写完整地址最好；只写裸域名也行（程序会自动补 https://），
# 但不填就取不到图——R2 桶默认私有，没有公开域名浏览器拿不到对象。
s3_endpoint =
s3_region = auto
s3_bucket =
s3_access_key =
s3_secret_key =
s3_public_base =

# ---------- 第三方统计 / 追踪脚本（可选） ----------
# 填 URL（http/https 开头）会自动渲染成 <script defer src="..."></script>，
# 例如 Umami 的 https://umami.example.com/script.js
# 需要附加属性或初始化代码的服务（百度统计、Plausible 等），可以把整段 <script>…</script> 贴进来。
# 只在公开页面生效，后台与登录页不会挂这个脚本。
track_script =

# 打开后会打印每个请求的日志（含超过 30ms 的慢查询）
debug = false

# ---------- 环境变量（不在本文件里） ----------
# 首次启动会用它们创建管理员账号，之后改用户名/密码请到后台「账号设置」：
#   ROND_ADMIN_USER      管理员用户名，默认 admin
#   ROND_ADMIN_PASSWORD  管理员密码，默认 rond-admin（务必登录后立即修改）
