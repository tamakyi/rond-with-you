{{define "content"}}
<div class="wrap" style="max-width:520px">
  <div class="page-head">
    <div>
      <h1>账号设置</h1>
      <div class="sub">修改密码后当前会话会失效，需要用新密码重新登录</div>
    </div>
  </div>

  <div class="card">
    <h2 style="font-size:14px;margin:0 0 10px">用户名</h2>
    {{if eq .Flash "name"}}<div class="alert ok">用户名已更新</div>{{end}}
    {{if .Err}}<div class="alert err">{{.Err}}</div>{{end}}
    <form method="post" action="/admin/username">
      <label class="f"><span>用户名（2~32 个字符，不含空格）</span><input type="text" name="username" value="{{.Username}}" maxlength="32" autocomplete="username" required></label>
      <label class="f"><span>当前密码</span><input type="password" name="current" autocomplete="current-password" required></label>
      <div class="row"><button class="btn primary" type="submit">修改用户名</button></div>
    </form>
  </div>

  <div class="card">
    <h2 style="font-size:14px;margin:0 0 10px">密码</h2>
    {{if and .Flash (ne .Flash "name")}}<div class="alert ok">密码已更新</div>{{end}}
    <form method="post" action="/admin/password">
      <label class="f"><span>当前密码</span><input type="password" name="current" autocomplete="current-password" required></label>
      <label class="f"><span>新密码（至少 8 位）</span><input type="password" name="password" autocomplete="new-password" minlength="8" required></label>
      <label class="f"><span>确认新密码</span><input type="password" name="confirm" autocomplete="new-password" minlength="8" required></label>
      <div class="row">
        <button class="btn primary" type="submit">修改密码</button>
        <a class="btn" href="/admin">返回后台</a>
      </div>
    </form>
  </div>
</div>
{{end}}
